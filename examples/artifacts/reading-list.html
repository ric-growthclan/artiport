<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Reading list</title>
<style>
  :root {
    --bg: #f5f5fa; --card: #ffffff; --ink: #1c1b22; --muted: #6f6d7c; --line: #e3e2ee;
    --todo: #868e96; --reading: #4c6ef5; --done: #2f9e44;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #111116; --card: #1b1a22; --ink: #eeedf5; --muted: #a3a1b3; --line: #2c2b36;
      --todo: #adb5bd; --reading: #748ffc; --done: #51cf66;
      color-scheme: dark;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  main { max-width: 580px; margin: 0 auto; padding: 24px 16px 48px; }
  h1 { margin: 0 0 16px; font-size: 26px; letter-spacing: -0.02em; }
  form { display: grid; grid-template-columns: 1fr 1fr auto; gap: 8px; margin-bottom: 16px; }
  input { min-width: 0; padding: 11px 12px; border: 1px solid var(--line); border-radius: 12px; background: var(--card); color: inherit; font: inherit; }
  form button { padding: 0 18px; border: 0; border-radius: 12px; background: var(--ink); color: var(--bg); font: inherit; font-weight: 600; cursor: pointer; }
  .filters { display: flex; gap: 6px; margin-bottom: 12px; overflow-x: auto; }
  .filters button { padding: 6px 12px; border: 1px solid var(--line); border-radius: 999px; background: var(--card); color: var(--muted); font: inherit; font-size: 13px; white-space: nowrap; cursor: pointer; }
  .filters button[aria-pressed="true"] { border-color: var(--ink); color: var(--ink); font-weight: 600; }
  ul { margin: 0; padding: 0; list-style: none; border: 1px solid var(--line); border-radius: 16px; background: var(--card); }
  li { display: flex; align-items: center; gap: 12px; padding: 12px 14px; border-top: 1px solid var(--line); }
  li:first-child { border-top: 0; }
  .book { flex: 1; min-width: 0; }
  .book strong { display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .book small { color: var(--muted); }
  .status { padding: 4px 10px; border: 0; border-radius: 999px; color: #fff; font: inherit; font-size: 12px; font-weight: 600; white-space: nowrap; cursor: pointer; }
  .status.todo { background: var(--todo); }
  .status.reading { background: var(--reading); }
  .status.done { background: var(--done); }
  .delete { padding: 4px; border: 0; background: none; color: var(--muted); font-size: 18px; line-height: 1; cursor: pointer; }
  .empty { padding: 28px 14px; color: var(--muted); text-align: center; border-top: 0; justify-content: center; }
  .note { margin: 12px 2px 0; color: var(--muted); font-size: 13px; }
  @media (max-width: 460px) { form { grid-template-columns: 1fr auto; } form input:nth-child(2) { grid-column: 1; } form button { grid-row: 1 / span 2; grid-column: 2; } }
</style>
</head>
<body>
<main>
  <h1>Reading list</h1>
  <form id="form">
    <input id="title" placeholder="Title" maxlength="120" required>
    <input id="author" placeholder="Author" maxlength="80">
    <button>Add</button>
  </form>
  <div class="filters" id="filters"></div>
  <ul id="list"></ul>
  <p class="note" id="note"></p>
</main>
<script>
  // Saved the way claude.ai chat artifacts persist data: the async window.storage API.
  const STATUSES = [
    ['todo', 'To read'],
    ['reading', 'Reading'],
    ['done', 'Finished'],
  ];
  const label = Object.fromEntries(STATUSES);
  let books = [];
  let filter = 'all';

  async function load() {
    try {
      const saved = await window.storage.get('books');
      books = JSON.parse(saved.value);
    } catch {
      books = [];
    }
    render();
  }

  async function persist() {
    try {
      await window.storage.set('books', JSON.stringify(books));
      document.getElementById('note').textContent = '';
    } catch (error) {
      document.getElementById('note').textContent = `Could not save: ${error.message}`;
    }
  }

  function el(tag, className, text) {
    const node = document.createElement(tag);
    if (className) node.className = className;
    if (text !== undefined) node.textContent = text;
    return node;
  }

  function render() {
    const filters = document.getElementById('filters');
    filters.replaceChildren(
      ...[['all', 'All'], ...STATUSES].map(([value, text]) => {
        const count = value === 'all' ? books.length : books.filter((b) => b.status === value).length;
        const button = el('button', '', `${text} · ${count}`);
        button.type = 'button';
        button.setAttribute('aria-pressed', String(filter === value));
        button.onclick = () => {
          filter = value;
          render();
        };
        return button;
      }),
    );

    const list = document.getElementById('list');
    const visible = books.filter((b) => filter === 'all' || b.status === filter);
    list.replaceChildren();
    if (visible.length === 0) {
      list.append(el('li', 'empty', books.length ? 'Nothing here yet.' : 'Add the first book you want to read.'));
      return;
    }
    for (const book of visible) {
      const item = el('li');
      const info = el('div', 'book');
      info.append(el('strong', '', book.title), el('small', '', book.author || 'Unknown author'));
      const status = el('button', `status ${book.status}`, label[book.status]);
      status.type = 'button';
      status.title = 'Change status';
      status.onclick = () => {
        const order = STATUSES.map(([value]) => value);
        book.status = order[(order.indexOf(book.status) + 1) % order.length];
        persist();
        render();
      };
      const remove = el('button', 'delete', '×');
      remove.type = 'button';
      remove.setAttribute('aria-label', `Remove ${book.title}`);
      remove.onclick = () => {
        books = books.filter((b) => b !== book);
        persist();
        render();
      };
      item.append(info, status, remove);
      list.append(item);
    }
  }

  document.getElementById('form').onsubmit = (event) => {
    event.preventDefault();
    const title = document.getElementById('title');
    const author = document.getElementById('author');
    books.unshift({ title: title.value.trim(), author: author.value.trim(), status: 'todo', added: Date.now() });
    title.value = '';
    author.value = '';
    title.focus();
    persist();
    render();
  };

  load();
</script>
</body>
</html>
